<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ui-sdk agent demo</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 28rem; margin: 2rem auto; padding: 0 1rem; }
      [data-slot="field"] { display: grid; gap: .25rem; margin-bottom: 1rem; }
      input, [data-slot="select-trigger"] { padding: .4rem; font: inherit; }
      [data-slot="switch"] { width: 2.5rem; height: 1.4rem; border-radius: 1rem; background: #bbb; position: relative; border: 0; }
      [data-slot="switch"][data-checked] { background: #2563eb; }
      [data-slot="switch-thumb"] { position: absolute; top: .2rem; left: .2rem; width: 1rem; height: 1rem; border-radius: 50%; background: #fff; transition: left .15s; }
      [data-checked] > [data-slot="switch-thumb"] { left: 1.3rem; }
      [data-slot="select-content"] { background: #fff; border: 1px solid #ccc; padding: .25rem; }
      [data-slot="select-item"][data-highlighted] { background: #e0e7ff; }
      #approval { position: fixed; inset: 0 0 auto 0; padding: 1rem; background: #fef3c7; border-bottom: 2px solid #d97706; display: none; }
      #approval[data-open] { display: block; }
      .chat { margin-top: 2rem; border-top: 1px solid #ddd; }
      .chat ol { list-style: none; padding: 0; font-size: .85rem; }
      .chat li { margin: .4rem 0; word-break: break-word; }
      .chat li[data-who="tool"] { color: #555; font-family: ui-monospace, monospace; font-size: .75rem; }
      .chat li[data-who="error"] { color: #b91c1c; }
      .chat form { display: flex; gap: .5rem; }
      .chat input { flex: 1; border: 1px solid #ccc; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="approval" role="alertdialog" aria-label="Agent approval" data-agent-hidden>
      <strong>The agent wants to:</strong> <span id="approval-text"></span>
      <div><button id="approve">Approve</button> <button id="deny">Deny</button></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
